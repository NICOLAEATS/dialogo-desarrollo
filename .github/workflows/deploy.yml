name: Deploy a InfinityFree

on:
  push:
    branches: [master]
    paths:
      - 'front/**'
      - 'admin/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Armar htdocs (front/ -> raiz, admin/ -> admin/)
        run: |
          rm -rf deploy_htdocs
          mkdir -p deploy_htdocs/admin
          cp -r front/. deploy_htdocs/
          cp -r admin/. deploy_htdocs/admin/
          # Nunca exponer dumps ni utilidades en el hosting
          rm -f deploy_htdocs/dialogoydesarrollo.sql \
                deploy_htdocs/database/dialogoydesarrollo.sql \
                deploy_htdocs/install_db.php \
                deploy_htdocs/db_info.php \
                deploy_htdocs/local-test-login.php \
                deploy_htdocs/__probe.php
          rm -rf deploy_htdocs/database
          ls deploy_htdocs | head -20

      - name: Subir por FTP a /htdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy_htdocs/
          server-dir: /htdocs/
          log-level: minimal
